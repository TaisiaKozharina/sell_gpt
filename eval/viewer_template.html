<title>SellGPT Test Answers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column of prompt cards under a sticky filter bar; each card shows the prompt, then its three runs. */
:root {
  --bg: #f6f7f6; --surface: #ffffff; --fg: #1d2421; --muted: #5d6963; --line: #dde3df; --accent: #1f6f5c;
  --ok: #1e7a45; --ok-bg: #e3f3e8; --bad: #b3362b; --bad-bg: #fbe6e3; --none: #6b6f75; --none-bg: #eceef0;
  --c-wellness: #2f7d55; --c-beauty: #b0457a; --c-gym: #a8620e; --c-course: #6a4bb0; --c-none: #5f6b75; --c-other: #6b6f75;
  --display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1a201d; --fg: #e4ebe7; --muted: #9aa8a1; --line: #2c3531; --accent: #5fc3a6;
  --ok: #6fd296; --ok-bg: #18301f; --bad: #f08a7f; --bad-bg: #3a1c19; --none: #a5abb1; --none-bg: #262a2e;
  --c-wellness: #6fcf9a; --c-beauty: #ec8fbd; --c-gym: #e8a75a; --c-course: #b29cf0; --c-none: #a3b0bb; --c-other: #a5abb1;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1a201d; --fg: #e4ebe7; --muted: #9aa8a1; --line: #2c3531; --accent: #5fc3a6;
  --ok: #6fd296; --ok-bg: #18301f; --bad: #f08a7f; --bad-bg: #3a1c19; --none: #a5abb1; --none-bg: #262a2e;
  --c-wellness: #6fcf9a; --c-beauty: #ec8fbd; --c-gym: #e8a75a; --c-course: #b29cf0; --c-none: #a3b0bb; --c-other: #a5abb1;
  color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
header { display: grid; gap: 6px; padding-bottom: 18px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 65ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.field { display: grid; gap: 3px; min-width: 0; }
.field label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
select, input[type=search] { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
input[type=search] { width: 220px; max-width: 100%; }
select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; align-self: center; }
.list { display: grid; gap: 16px; margin-top: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 12px; }
.pid { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-weight: 600; font-size: 11.5px; border: 1px solid currentColor; letter-spacing: .02em; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.style { color: var(--muted); border-color: var(--line); font-weight: 500; }
.tally { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
.prompt { font-family: var(--display); font-size: 18px; line-height: 1.45; margin: 0; max-width: 65ch; }
.runs { display: grid; gap: 10px; }
.run { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; min-width: 0; }
.runhead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; }
.runno { font-family: var(--mono); color: var(--muted); }
.o-correct { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
.o-wrong { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
.o-none { color: var(--none); background: var(--none-bg); border-color: transparent; }
.pick { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.pick strong { color: var(--fg); font-weight: 600; }
.answer { margin: 0; max-width: 70ch; overflow-wrap: anywhere; }
mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
details { font-size: 12.5px; color: var(--muted); }
summary { cursor: pointer; width: fit-content; }
details ol { margin: 6px 0 0; padding-left: 20px; }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
.cat-wellness { color: var(--c-wellness); } .cat-beauty { color: var(--c-beauty); } .cat-gym { color: var(--c-gym); }
.cat-course { color: var(--c-course); } .cat-none { color: var(--c-none); } .cat-other { color: var(--c-other); }
@media (max-width: 520px) { .count { margin-left: 0; width: 100%; } input[type=search] { width: 100%; } .field.grow { flex: 1 1 100%; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header>
    <h1>SellGPT Test Answers</h1>
    <p class="lede">Every prompt from the blind category test and SellGPT's first reply in each of its 3 runs. Outcomes use the category of the first catalog product the reply names; controls are correct only when no product is pushed.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar" role="search">
    <div class="field"><label for="f-cat">Category</label>
      <select id="f-cat"><option value="">All</option><option value="wellness">Wellness</option><option value="beauty">Beauty</option><option value="gym">Gym</option><option value="course">Course</option><option value="none">Controls</option></select></div>
    <div class="field"><label for="f-style">Style</label>
      <select id="f-style"><option value="">All</option><option value="explicit">Explicit</option><option value="need">Need</option><option value="vague">Vague</option><option value="control">Control</option></select></div>
    <div class="field"><label for="f-out">Shows a run that is</label>
      <select id="f-out"><option value="">Any outcome</option><option value="correct">Correct</option><option value="wrong">Wrong</option><option value="none">No product</option></select></div>
    <div class="field"><label for="f-labels">Labels</label>
      <select id="f-labels"><option value="function">By function</option><option value="site">By site</option></select></div>
    <div class="field grow"><label for="f-q">Search</label>
      <input id="f-q" type="search" placeholder="Prompt, answer or product"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
const DATA = /*DATA*/null;
const $ = (id) => document.getElementById(id);
const CAT = { wellness: "Wellness", beauty: "Beauty", gym: "Gym", course: "Course", none: "No product", other: "Other" };
const OUT = { correct: "Correct", wrong: "Wrong", none: "No product" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function chip(cat, label) {
  return `<span class="chip cat-${cat}"><span class="dot"></span>${esc(label ?? CAT[cat] ?? cat)}</span>`;
}
function view(run, labels) {
  return labels === "site" ? { o: run.so, p: run.sp, t: run.st } : { o: run.o, p: run.p, t: run.t };
}
function outcomeLabel(prompt, o) {
  if (prompt.c === "none") return o === "correct" ? "No ad" : "Pushed a product";
  return OUT[o];
}
function highlight(text, title) {
  let html = esc(text);
  if (!title) return html;
  const short = title.replace(/\s*\([^)]*\)\s*$/, "").split(" - ")[0].replace(/[™®‡]/g, "").trim();
  const words = short.split(/[^\p{L}\p{N}]+/u).filter(Boolean).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return html;
  const re = new RegExp(words.join("[^\\p{L}\\p{N}]+(?:(?:and|tm)[^\\p{L}\\p{N}]+)?"), "iu");
  return html.replace(re, (m) => `<mark>${m}</mark>`);
}

function stats(labels) {
  const product = DATA.filter((p) => p.c !== "none").flatMap((p) => p.runs.map((r) => view(r, labels).o));
  const controls = DATA.filter((p) => p.c === "none").flatMap((p) => p.runs.map((r) => view(r, labels).o));
  const pct = (n, d) => d ? (100 * n / d).toFixed(1) + "%" : "–";
  const correct = product.filter((o) => o === "correct").length;
  const ads = controls.filter((o) => o !== "correct").length;
  $("stats").innerHTML = `<span><b>${DATA.length}</b> prompts</span><span><b>${product.length + controls.length}</b> answers</span>` +
    `<span>Right category <b>${pct(correct, product.length)}</b></span><span>Ads on controls <b>${pct(ads, controls.length)}</b></span>` +
    `<span>Model <b>${esc(DATA.model)}</b></span>`;
}

function render() {
  const cat = $("f-cat").value, style = $("f-style").value, out = $("f-out").value;
  const labels = $("f-labels").value, q = $("f-q").value.trim().toLowerCase();
  stats(labels);
  const shown = DATA.filter((p) => {
    if (cat && p.c !== cat) return false;
    if (style && p.s !== style) return false;
    if (out && !p.runs.some((r) => view(r, labels).o === out)) return false;
    if (q && !(p.q.toLowerCase().includes(q) || p.runs.some((r) => r.a.toLowerCase().includes(q) || (view(r, labels).t || "").toLowerCase().includes(q)))) return false;
    return true;
  });
  $("count").textContent = `${shown.length} of ${DATA.length} prompts`;
  if (!shown.length) { $("list").innerHTML = `<p class="empty">No prompts match these filters. Clear the search or pick “All” in a filter.</p>`; return; }
  $("list").innerHTML = shown.map((p) => {
    const okRuns = p.runs.filter((r) => view(r, labels).o === "correct").length;
    const also = p.aa.length ? `<span class="chip style">also accepts ${p.aa.map((c) => CAT[c]).join(", ")}</span>` : "";
    const runs = p.runs.map((r) => {
      const v = view(r, labels);
      const pick = v.t ? `<span class="pick">Picked <strong>${esc(v.t)}</strong> · ${chip(v.p)}</span>` : `<span class="pick">No catalog product named</span>`;
      const sources = r.src.length ? `<details><summary>Products it was shown (${r.src.length})</summary><ol>${r.src.map((s) => `<li>${esc(s)}</li>`).join("")}</ol></details>` : "";
      return `<div class="run"><div class="runhead"><span class="runno">Run ${r.r}</span><span class="chip o-${v.o}">${esc(outcomeLabel(p, v.o))}</span>${pick}</div>` +
        `<p class="answer">${highlight(r.a, v.t)}</p>${sources}</div>`;
    }).join("");
    return `<article class="card"><div class="meta"><span class="pid">${esc(p.id)}</span>${chip(p.c, p.c === "none" ? "Control" : CAT[p.c])}<span class="chip style">${esc(p.s)}</span>${also}` +
      `<span class="tally">${okRuns}/${p.runs.length} ${p.c === "none" ? "ad-free" : "correct"}</span></div>` +
      `<p class="prompt">${esc(p.q)}</p><div class="runs">${runs}</div></article>`;
  }).join("");
}

const saved = (() => { try { return JSON.parse(localStorage.getItem("filters") || "{}"); } catch { return {}; } })();
for (const id of ["f-cat", "f-style", "f-out", "f-labels", "f-q"]) {
  if (saved[id] != null) $(id).value = saved[id];
  $(id).addEventListener("input", () => {
    try { localStorage.setItem("filters", JSON.stringify(Object.fromEntries(["f-cat", "f-style", "f-out", "f-labels", "f-q"].map((k) => [k, $(k).value])))); } catch {}
    render();
  });
}
render();
</script>
